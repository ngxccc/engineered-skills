name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Build cross-platform binaries
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X main.version=${GITHUB_REF_NAME}"

          # Linux amd64 & arm64
          GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/engineered-cli_linux_amd64 ./cmd/engineered-cli
          GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/engineered-cli_linux_arm64 ./cmd/engineered-cli

          # macOS amd64 & arm64
          GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/engineered-cli_darwin_amd64 ./cmd/engineered-cli
          GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/engineered-cli_darwin_arm64 ./cmd/engineered-cli

          # Windows amd64
          GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/engineered-cli_windows_amd64.exe ./cmd/engineered-cli

          # Package archives
          cd dist
          tar -czf "engineered-cli_${VERSION}_linux_amd64.tar.gz" engineered-cli_linux_amd64
          tar -czf "engineered-cli_${VERSION}_linux_arm64.tar.gz" engineered-cli_linux_arm64
          tar -czf "engineered-cli_${VERSION}_darwin_amd64.tar.gz" engineered-cli_darwin_amd64
          tar -czf "engineered-cli_${VERSION}_darwin_arm64.tar.gz" engineered-cli_darwin_arm64
          zip -q "engineered-cli_${VERSION}_windows_amd64.zip" engineered-cli_windows_amd64.exe

          # Generate SHA256 checksums
          sha256sum *.tar.gz *.zip > checksums.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
